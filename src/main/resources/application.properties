# ══════════════════════════════════════════════════════════════
# application.properties — Microservicio de Matrículas SOA
# APF3 — DeveloperAnder
# ══════════════════════════════════════════════════════════════

# Nombre del microservicio (usado en logs y service discovery)
spring.application.name=microservice-colegio

# ── BASE DE DATOS MYSQL ───────────────────────────────────────
# DECISIÓN APF3: MySQL en lugar de PostgreSQL (APF2).
# Justificación: entorno local disponible. Migración a PostgreSQL
# solo requiere cambiar driver y dialect. Sin cambios en código Java.
spring.datasource.url=jdbc:mysql://localhost:3306/colegio_matricula_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / HIBERNATE ───────────────────────────────────────────
# update = Hibernate agrega columnas nuevas sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── SERVIDOR ──────────────────────────────────────────────────
server.port=8080

# ── RABBITMQ — Mensajería asíncrona SOA ──────────────────────
# Host donde corre RabbitMQ (localhost para desarrollo)
spring.rabbitmq.host=localhost
# Puerto estándar de RabbitMQ (AMQP)
spring.rabbitmq.port=5672
# Usuario por defecto de RabbitMQ
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Virtual host (/ = default de RabbitMQ)
spring.rabbitmq.virtual-host=/

# Nombres del exchange, cola y routing key (leídos por RabbitMQConfig)
rabbitmq.exchange.matriculas=exchange.matriculas
rabbitmq.routingkey.matricula-registrada=rk.matricula.registrada

# ── SEGURIDAD JWT (simula validación del ESB WSO2) ────────────
# false = modo desarrollo con Swagger UI (sin token)
# true  = activa validación JWT (simula ESB en producción)
app.security.jwt.enabled=false
# Clave secreta para firmar/verificar JWT (mínimo 32 caracteres)
app.security.jwt.secret=colegio-secret-key-apf3-2026-muy-larga-256bits

# ── URLs DE SERVICIOS EXTERNOS SOA ───────────────────────────
# TesoreriaService: consulta deudas del estudiante
# (si está apagado, TesoreriaClient usa STUB automáticamente)
servicios.tesoreria.url=http://localhost:8081

# AulaService: consulta vacantes disponibles en el aula
# (si está apagado, AulaClient usa STUB automáticamente)
servicios.aula.url=http://localhost:8082

# ── SWAGGER / SPRINGDOC ───────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.docExpansion=list

# ── LOGGING ───────────────────────────────────────────────────
# INFO = muestra los logs del orquestador BPM y los clientes SOA
logging.level.com.developerander.microservice.colegio=INFO
# Muestra logs de RabbitMQ
logging.level.org.springframework.amqp=WARN
